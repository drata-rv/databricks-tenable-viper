bundle:
  name: vipr-drata

variables:
  secret_scope:
    default: vipr-drata-test
  warehouse_id:
    default: ""
  # No source-table defaults: each target sets its own, so prod can never inherit a test table.
  findings_table:
    default: ""
  assets_table:
    default: ""
  workspace_name:
    default: test
  drata_prod:
    default: "false"
  findings_connection_id:
    default: ""
  findings_resource_id:
    default: ""
  assets_connection_id:
    default: ""
  assets_resource_id:
    default: ""
  push_mode:
    default: upsert
  tenable_assets_table:
    default: ""   # optional: Tenable scanner-activity evidence (t_tenable_assets)

artifacts:
  vipr_drata:
    type: whl
    build: rm -rf build dist && python -m build --wheel
    path: .

resources:
  jobs:
    vipr_drata_sync:
      name: vipr-drata-sync-${bundle.target}
      tasks:
        - task_key: sync
          environment_key: default
          python_wheel_task:
            package_name: vipr_drata
            entry_point: vipr-drata
            parameters:
              - --workspace
              - ${var.workspace_name}
              - --warehouse-id
              - ${var.warehouse_id}
              - --env
              - DATABRICKS_SECRET_SCOPE_TEST=${var.secret_scope}
              - --env
              - DATABRICKS_SECRET_SCOPE_PROD=${var.secret_scope}
              - --env
              - VIPR_FINDINGS_TABLE=${var.findings_table}
              - --env
              - VIPR_ASSETS_TABLE=${var.assets_table}
              - --env
              - TENABLE_ASSETS_TABLE=${var.tenable_assets_table}
              - --env
              - DRATA_PROD=${var.drata_prod}
              - --env
              - DRATA_PUSH_MODE=${var.push_mode}
              - --env
              - DRATA_FINDINGS_CONNECTION_ID=${var.findings_connection_id}
              - --env
              - DRATA_FINDINGS_RESOURCE_ID=${var.findings_resource_id}
              - --env
              - DRATA_ASSETS_CONNECTION_ID=${var.assets_connection_id}
              - --env
              - DRATA_ASSETS_RESOURCE_ID=${var.assets_resource_id}
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ./dist/*.whl
      # schedule:
      #   quartz_cron_expression: "0 0 2 * * ?"
      #   timezone_id: UTC
      #   pause_status: PAUSED

    smoke_test:
      name: vipr-drata-smoke-${bundle.target}
      tasks:
        - task_key: smoke
          spark_python_task:
            python_file: ./resources/smoke.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"

targets:
  test:
    default: true
    mode: development
    variables:
      findings_table: si_test_catalog.nw_harmonized_sensitive.t_vipr_all_findings
      assets_table: si_test_catalog.nw_harmonized_sensitive.t_vipr_all_assets
  prod:
    mode: production
    workspace:
      root_path: /Shared/vipr-drata
    variables:
      secret_scope: vipr-drata-prod
      workspace_name: prod
      drata_prod: "true"
      # Vipr tables are only documented in si_test_catalog (docs/Vipr Tables Describe.xlsx).
      # findings_table / assets_table intentionally empty -> the job fails closed until Nationwide
      # confirms a prod location (the CLI also refuses test-catalog sources with Drata prod).
      findings_table: ""
      assets_table: ""
      tenable_assets_table: si_prod_catalog.nw_harmonized_sensitive.t_tenable_assets
    # run_as:
    #   service_principal_name: <application-id-uuid>
