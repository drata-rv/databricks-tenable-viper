bundle:
  name: vipr-drata

variables:
  secret_scope:
    default: vipr-drata-test
  warehouse_id:
    default: ""
  findings_table:
    default: ""
  assets_table:
    default: ""
  workspace_name:
    default: test
  drata_prod:
    default: "false"
  connection_id:
    default: ""
  resource_id:
    default: ""
  push_mode:
    default: session
  finding_lane_buckets:
    default: ""
  asset_buckets:
    default: "4"
  closed_lookback_days:
    default: "90"
  max_source_age_days:
    default: "3"
  max_record_bytes:
    default: "4000000"
  min_findings:
    default: "1"
  min_assets:
    default: "1"
  scan_stale_days:
    default: "7"
  max_reject_ratio:
    default: ""
  scanner_tool:
    default: tenable
  scanner_severity_map:
    default: ""
  tenable_assets_table:
    default: ""

artifacts:
  vipr_drata:
    type: whl
    build: rm -rf build dist && python -m build --wheel
    path: .

resources:
  jobs:
    vipr_drata_sync:
      name: vipr-drata-sync-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: sync
          environment_key: default
          python_wheel_task:
            package_name: vipr_drata
            entry_point: vipr-drata
            parameters:
              - --workspace
              - ${var.workspace_name}
              - --warehouse-id
              - ${var.warehouse_id}
              - --env
              - DATABRICKS_SECRET_SCOPE_TEST=${var.secret_scope}
              - --env
              - DATABRICKS_SECRET_SCOPE_PROD=${var.secret_scope}
              - --env
              - VIPR_FINDINGS_TABLE=${var.findings_table}
              - --env
              - VIPR_ASSETS_TABLE=${var.assets_table}
              - --env
              - TENABLE_ASSETS_TABLE=${var.tenable_assets_table}
              - --env
              - DRATA_PROD=${var.drata_prod}
              - --env
              - DRATA_PUSH_MODE=${var.push_mode}
              - --env
              - FINDING_LANE_BUCKETS=${var.finding_lane_buckets}
              - --env
              - ASSET_BUCKETS=${var.asset_buckets}
              - --env
              - CLOSED_LOOKBACK_DAYS=${var.closed_lookback_days}
              - --env
              - MAX_SOURCE_AGE_DAYS=${var.max_source_age_days}
              - --env
              - MAX_RECORD_BYTES=${var.max_record_bytes}
              - --env
              - MIN_FINDINGS=${var.min_findings}
              - --env
              - MIN_ASSETS=${var.min_assets}
              - --env
              - SCAN_STALE_DAYS=${var.scan_stale_days}
              - --env
              - MAX_REJECT_RATIO=${var.max_reject_ratio}
              - --env
              - SCANNER_TOOL=${var.scanner_tool}
              - --env
              - SCANNER_SEVERITY_MAP=${var.scanner_severity_map}
              - --env
              - DRATA_CONNECTION_ID=${var.connection_id}
              - --env
              - DRATA_RESOURCE_ID=${var.resource_id}
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ./dist/*.whl
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

    smoke_test:
      name: vipr-drata-smoke-${bundle.target}
      tasks:
        - task_key: smoke
          spark_python_task:
            python_file: ./resources/smoke.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"

targets:
  test:
    default: true
    mode: development
    variables:
      findings_table: si_test_catalog.nw_harmonized_sensitive.t_vipr_all_findings
      assets_table: si_test_catalog.nw_harmonized_sensitive.t_vipr_all_assets
  prod:
    mode: production
    workspace:
      root_path: /Shared/vipr-drata
    variables:
      secret_scope: vipr-drata-prod
      workspace_name: prod
      drata_prod: "true"
      # prod Vipr tables unconfirmed: empty fails closed
      findings_table: ""
      assets_table: ""
      tenable_assets_table: si_prod_catalog.nw_harmonized_sensitive.t_tenable_assets
    # set run_as.service_principal_name (Application ID UUID) and workspace.host
