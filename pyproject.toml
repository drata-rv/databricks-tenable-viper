[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vipr-drata"
version = "0.10.1"
description = "Vipr (Databricks) -> Drata vulnerability evidence integration"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk==0.40.0",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "openpyxl>=3.1", "build>=1"]

[project.scripts]
vipr-drata = "vipr_drata.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
